localStorage.setItem("research-projects", "{\"projects\": [{\"id\": \"pmvdopuaxuyyz\", \"name\": \"\u6d4b\u8bd5\u5de5\u4f5c\u533a\", \"papers\": {\"f7f52591b7d34a0497461ffb19701881\": {\"paper\": {\"id\": \"arxiv:2005.11401\", \"title\": \"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\", \"authors\": [\"Patrick Lewis\", \"Ethan Perez\", \"Aleksandra Piktus\", \"Fabio Petroni\", \"Vladimir Karpukhin\", \"Naman Goyal\", \"Heinrich K\u00fcttler\", \"Mike Lewis\", \"Wen-tau Yih\", \"Tim Rockt\u00e4schel\", \"Sebastian Riedel\", \"Douwe Kiela\"], \"author_ids\": [], \"abstract\": \"Large pre-trained language models have been shown to store factual knowledge in their parameters, and achieve state-of-the-art results when fine-tuned on downstream NLP tasks. However, their ability to access and precisely manipulate knowledge is still limited, and hence on knowledge-intensive tasks, their performance lags behind task-specific architectures. Additionally, providing provenance for their decisions and updating their world knowledge remain open research problems. Pre-trained models with a differentiable access mechanism to explicit non-parametric memory can overcome this issue, but have so far been only investigated for extractive downstream tasks. We explore a general-purpose fine-tuning recipe for retrieval-augmented generation (RAG) -- models which combine pre-trained parametric and non-parametric memory for language generation. We introduce RAG models where the parametric memory is a pre-trained seq2seq model and the non-parametric memory is a dense vector index of Wikipedia, accessed with a pre-trained neural retriever. We compare two RAG formulations, one which conditions on the same retrieved passages across the whole generated sequence, the other can use different passages per token. We fine-tune and evaluate our models on a wide range of knowledge-intensive NLP tasks and set the state-of-the-art on three open domain QA tasks, outperforming parametric seq2seq models and task-specific retrieve-and-extract architectures. For language generation tasks, we find that RAG models generate more specific, diverse and factual language than a state-of-the-art parametric-only seq2seq baseline.\", \"year\": 2020, \"venue\": \"arXiv\uff08\u9884\u5370\u672c\uff09\", \"sources\": [\"arxiv\"], \"url\": \"https://arxiv.org/abs/2005.11401\", \"pdf_url\": \"https://arxiv.org/pdf/2005.11401v4\", \"citation_count\": null, \"arxiv_id\": \"2005.11401\", \"doi\": null, \"semantic_scholar_id\": null, \"ccf_rank\": null, \"cas_partition\": null, \"ccf_status\": \"preprint\", \"ccf_catalog_version\": \"ccfddl-conference-aliases\", \"local_id\": \"f7f52591b7d34a0497461ffb19701881\", \"imported_at\": \"2026-10-17T03:12:52.579875+00:00\"}, \"added_at\": \"2026-10-18T10:33:37.596943+00:00\"}, \"eccde04cdd0f41fb8b65c93c6d5d1019\": {\"paper\": {\"id\": \"arxiv:2401.15884\", \"title\": \"Corrective Retrieval Augmented Generation\", \"authors\": [\"Shi-Qi Yan\", \"Jia-Chen Gu\", \"Yun Zhu\", \"Zhen-Hua Ling\"], \"author_ids\": [], \"abstract\": \"Large language models (LLMs) inevitably exhibit hallucinations since the accuracy of generated texts cannot be secured solely by the parametric knowledge they encapsulate. Although retrieval-augmented generation (RAG) is a practicable complement to LLMs, it relies heavily on the relevance of retrieved documents, raising concerns about how the model behaves if retrieval goes wrong. To this end, we propose the Corrective Retrieval Augmented Generation (CRAG) to improve the robustness of generation. Specifically, a lightweight retrieval evaluator is designed to assess the overall quality of retrieved documents for a query, returning a confidence degree based on which different knowledge retrieval actions can be triggered. Since retrieval from static and limited corpora can only return sub-optimal documents, large-scale web searches are utilized as an extension for augmenting the retrieval results. Besides, a decompose-then-recompose algorithm is designed for retrieved documents to selectively focus on key information and filter out irrelevant information in them. CRAG is plug-and-play and can be seamlessly coupled with various RAG-based approaches. Experiments on four datasets covering short- and long-form generation tasks show that CRAG can significantly improve the performance of RAG-based approaches.\", \"year\": 2024, \"venue\": \"arXiv\uff08\u9884\u5370\u672c\uff09\", \"sources\": [\"semantic_scholar\"], \"url\": \"https://arxiv.org/abs/2401.15884\", \"pdf_url\": \"https://arxiv.org/pdf/2401.15884\", \"citation_count\": 331, \"arxiv_id\": \"2401.15884\", \"doi\": \"10.48550/arXiv.2401.15884\", \"semantic_scholar_id\": \"5bbc2b5aa6c63c6a2cfccf095d6020b063ad47ac\", \"ccf_rank\": null, \"cas_partition\": null, \"ccf_status\": \"preprint\", \"ccf_catalog_version\": \"ccfddl-conference-aliases\", \"local_id\": \"eccde04cdd0f41fb8b65c93c6d5d1019\", \"imported_at\": \"2026-10-17T04:08:41.120666+00:00\"}, \"added_at\": \"2026-10-18T10:33:37.619811+00:00\"}, \"4bd19b6da1934fb3b881ad25f50a494b\": {\"paper\": {\"id\": \"arxiv:2203.08975\", \"title\": \"A Survey of Multi-Agent Deep Reinforcement Learning with Communication\", \"authors\": [\"Changxi Zhu\", \"Mehdi Dastani\", \"Shihan Wang\"], \"author_ids\": [], \"abstract\": \"Communication is an effective mechanism for coordinating the behaviors of multiple agents, broadening their views of the environment, and to support their collaborations. In the field of multi-agent deep reinforcement learning (MADRL), agents can improve the overall learning performance and achieve their objectives by communication. Agents can communicate various types of messages, either to all agents or to specific agent groups, or conditioned on specific constraints. With the growing body of research work in MADRL with communication (Comm-MADRL), there is a lack of a systematic and structural approach to distinguish and classify existing Comm-MADRL approaches. In this paper, we survey recent works in the Comm-MADRL field and consider various aspects of communication that can play a role in designing and developing multi-agent reinforcement learning systems. With these aspects in mind, we propose 9 dimensions along which Comm-MADRL approaches can be analyzed, developed, and compared. By projecting existing works into the multi-dimensional space, we discover interesting trends. We also propose some novel directions for designing future Comm-MADRL systems through exploring possible combinations of the dimensions.\", \"year\": 2022, \"venue\": \"Auton. Agents Multi Agent Syst. 38(1): 4 (2024)\", \"sources\": [\"arxiv\"], \"url\": \"https://arxiv.org/abs/2203.08975\", \"pdf_url\": \"https://arxiv.org/pdf/2203.08975v2\", \"citation_count\": null, \"arxiv_id\": \"2203.08975\", \"doi\": null, \"semantic_scholar_id\": null, \"ccf_rank\": null, \"cas_partition\": null, \"ccf_status\": \"unmatched\", \"ccf_catalog_version\": \"ccfddl-conference-aliases\", \"local_id\": \"4bd19b6da1934fb3b881ad25f50a494b\", \"imported_at\": \"2026-10-17T12:43:12.170718+00:00\"}, \"added_at\": \"2026-10-18T10:33:37.630864+00:00\"}, \"b45b995f819b445ca9886e77906249ba\": {\"paper\": {\"id\": \"arxiv:2504.05324\", \"title\": \"Hybrid Retrieval for Hallucination Mitigation in Large Language Models: A Comparative Analysis\", \"authors\": [\"C. Mala\", \"Gizem Gezici\", \"Fosca Giannotti\"], \"author_ids\": [], \"abstract\": \"Large Language Models (LLMs) excel in language comprehension and generation but are prone to hallucinations, producing factually incorrect or unsupported outputs. Retrieval Augmented Generation (RAG) systems address this issue by grounding LLM responses with external knowledge. This study evaluates the relationship between retriever effectiveness and hallucination reduction in LLMs using three retrieval approaches: sparse retrieval based on BM25 keyword search, dense retrieval using semantic search with Sentence Transformers, and a proposed hybrid retrieval module. The hybrid module incorporates query expansion and combines the results of sparse and dense retrievers through a dynamically weighted Reciprocal Rank Fusion score. Using the HaluBench dataset, a benchmark for hallucinations in question answering tasks, we assess retrieval performance with metrics such as mean average precision and normalised discounted cumulative gain, focusing on the relevance of the top three retrieved documents. Results show that the hybrid retriever achieves better relevance scores, outperforming both sparse and dense retrievers. Further evaluation of LLM-generated answers against ground truth using metrics such as accuracy, hallucination rate, and rejection rate reveals that the hybrid retriever achieves the highest accuracy on fails, the lowest hallucination rate, and the lowest rejection rate. These findings highlight the hybrid retriever's ability to enhance retrieval relevance, reduce hallucination rates, and improve LLM reliability, emphasising the importance of advanced retrieval techniques in mitigating hallucinations and improving response accuracy.\", \"year\": 2025, \"venue\": \"arXiv\uff08\u9884\u5370\u672c\uff09\", \"sources\": [\"semantic_scholar\"], \"url\": \"https://arxiv.org/abs/2504.05324\", \"pdf_url\": \"https://arxiv.org/pdf/2504.05324\", \"citation_count\": 14, \"arxiv_id\": \"2504.05324\", \"doi\": \"10.48550/arXiv.2504.05324\", \"semantic_scholar_id\": \"0b374b43c171bc63935e2b01147dcb1857cb56d3\", \"ccf_rank\": null, \"cas_partition\": null, \"ccf_status\": \"preprint\", \"ccf_catalog_version\": \"ccfddl-conference-aliases\", \"local_id\": \"b45b995f819b445ca9886e77906249ba\", \"imported_at\": \"2026-10-17T03:24:15.714001+00:00\"}, \"added_at\": \"2026-10-18T10:33:37.645341+00:00\"}, \"da1590b2cd2444cea598dda29b0344d7\": {\"paper\": {\"id\": \"arxiv:2409.01907\", \"title\": \"Focus Agent: LLM-Powered Virtual Focus Group\", \"authors\": [\"Taiyu Zhang\", \"Xuesong Zhang\", \"Robbe Cools\", \"Adalberto L. Simeone\"], \"author_ids\": [], \"abstract\": \"In the domain of Human-Computer Interaction, focus groups represent a widely utilised yet resource-intensive methodology, often demanding the expertise of skilled moderators and meticulous preparatory efforts. This study introduces the ``Focus Agent,'' a Large Language Model (LLM) powered framework that simulates both the focus group (for data collection) and acts as a moderator in a focus group setting with human participants. To assess the data quality derived from the Focus Agent, we ran five focus group sessions with a total of 23 human participants as well as deploying the Focus Agent to simulate these discussions with AI participants. Quantitative analysis indicates that Focus Agent can generate opinions similar to those of human participants. Furthermore, the research exposes some improvements associated with LLMs acting as moderators in focus group discussions that include human participants.\", \"year\": 2024, \"venue\": \"Taiyu Zhang, Xuesong Zhang, Robbe Cools, and Adalberto Simeone. 2024. Focus Agent: LLM-Powered Virtual Focus Group. In ACM International Conference on Intelligent Virtual Agents (IVA '24), September 16--19, 2024, GLASGOW, United Kingdom\", \"sources\": [\"arxiv\"], \"url\": \"https://arxiv.org/abs/2409.01907\", \"pdf_url\": \"https://arxiv.org/pdf/2409.01907v1\", \"citation_count\": null, \"arxiv_id\": \"2409.01907\", \"doi\": \"10.1145/3652988.3673918\", \"semantic_scholar_id\": null, \"ccf_rank\": \"B\", \"cas_partition\": null, \"ccf_status\": \"verified\", \"ccf_catalog_version\": \"ccfddl-conference-aliases\", \"local_id\": \"da1590b2cd2444cea598dda29b0344d7\", \"imported_at\": \"2026-10-17T12:43:13.893717+00:00\"}, \"added_at\": \"2026-10-18T10:33:37.657862+00:00\"}}, \"openedAt\": 1792460000000}], \"currentId\": \"pmvdopuaxuyyz\"}");
