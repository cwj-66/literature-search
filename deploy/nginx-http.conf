server {
    listen 80;
    server_name papers.chenwj.click;
    server_tokens off;
    charset utf-8;
    root /opt/paper-search/frontend/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:15179;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:15179/api/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = / { try_files /index.html =404; expires -1; }
    location = /library { try_files /index.html =404; expires -1; }
    location = /paper { try_files /index.html =404; expires -1; }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        try_files $uri =404;
    }
}
