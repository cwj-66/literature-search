# Included inside the existing chenwj.click TLS server. Reuses its login check.
location = /demo/paper-search { return 308 /demo/paper-search/; }

location ^~ /demo/paper-search/api/ {
    auth_request /_portfolio_auth;
    error_page 401 = @paper_demo_api_login;
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:15179/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header Cache-Control "no-store" always;
}

location @paper_demo_api_login {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"detail":"请重新登录作品集","code":"demo_access_required"}';
}

location ^~ /demo/paper-search/assets/ {
    auth_request /_portfolio_auth;
    alias /opt/paper-search/frontend/dist/assets/;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=604800";
}

location ^~ /demo/paper-search/ {
    auth_request /_portfolio_auth;
    error_page 401 = @portfolio_login;
    alias /opt/paper-search/frontend/dist/;
    try_files $uri /paper-demo-index;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}

location = /paper-demo-index {
    internal;
    default_type text/html;
    auth_request /_portfolio_auth;
    error_page 401 = @portfolio_login;
    alias /opt/paper-search/frontend/dist/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
