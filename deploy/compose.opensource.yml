# Independent browser-session instance.
services:
  api:
    image: paper-search-opensource-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.opensource
        required: false
    environment:
      PAPER_USER_SESSIONS: "1"
      PAPER_DB_PATH: /app/data/papers.sqlite3
      SQLITE_TMPDIR: /app/data
    ports:
      - "127.0.0.1:15180:8000"
    volumes:
      - opensource_data:/app/data
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  opensource_data:
